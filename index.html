<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6655D9" id="theme-color-meta" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of light UI.
      (function () {
        try {
          var stored = localStorage.getItem('finora_theme');
          var system = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || (stored !== 'light' && system);
          document.documentElement.classList.toggle('dark', dark);
          var meta = document.getElementById('theme-color-meta');
          if (meta) meta.setAttribute('content', dark ? '#0E0F15' : '#6655D9');
        } catch (error) {
          /* ignore storage access errors */
        }
      })();
    </script>
    <title>Finora — Smart Personal Finance</title>
    <meta
      name="description"
      content="Kelola saldo rekening, e-wallet, pemasukan, pengeluaran, anggaran, target tabungan, impor CSV, dan analisis keuangan cerdas dalam satu aplikasi responsif."
    />
    <meta property="og:title" content="Finora — Smart Personal Finance" />
    <meta
      property="og:description"
      content="Kelola saldo rekening, e-wallet, pemasukan, pengeluaran, anggaran, target tabungan, impor CSV, dan analisis keuangan cerdas dalam satu aplikasi responsif."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background text-text-primary antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
